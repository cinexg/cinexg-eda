[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "statlens"
version = "0.1.0"
authors = [
  { name="Gaurav Raj Singh", email="connect.cinexg@gmail.com" },
]
description = "Automated dataset analysis and exploratory data analysis (EDA)"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "google-generativeai"
]

[project.urls]
Homepage = "https://github.com/gauravxsuvo/Statlens"
Repository = "https://github.com/gauravxsuvo/Statlens"

[project.scripts]
statlens = "statlens.cli:main"

[tool.setuptools]
packages = ["statlens"]

[tool.setuptools.package-data]
statlens = ["templates/*.html"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Keep this to real correctness issues (pyflakes) and basic syntax/style errors,
# not import-sorting or style-modernization opinions.
select = ["E4", "E7", "E9", "F"]