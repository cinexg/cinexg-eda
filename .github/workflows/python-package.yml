name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Testing across the exact versions you want to support
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest ruff
        # This installs your statlens package and all its dependencies from pyproject.toml
        pip install .

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Test with pytest
      run: |
        # Runs the tests/ directory automatically
        pytest
